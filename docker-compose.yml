services:
    db:
        image: postgres:18
        container_name: postgres_db
        volumes:
            - postgres_db:/var/lib/postgresql
        environment:
            - "POSTGRES_HOST_AUTH_METHOD=trust"
        env_file:
            - .env
    web:
        build: .
        container_name: django_app
        ports:
            - "8000:8000"
        command: uv run python manage.py runserver 0.0.0.0:8000
        volumes:
            - .:/app
        env_file:
            - .env
        depends_on:
            - db

volumes:
    postgres_db:
